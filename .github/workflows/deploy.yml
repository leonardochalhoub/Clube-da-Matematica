name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# PT-BR ONLY BUILD (2026-08-06)
#
# The frontend was converged to PT-BR only — translating lesson MDX into other
# languages burns real LLM token budget the project can't sustain right now.
# Translated content (content/i18n/, translations.ts, audio strings) stays in
# the repo untouched as paused inventory; it's just not routed/served anymore.
#
# pt-BR is a normal URL locale (/pt-br/…) served by the unified
# app/[locale]/[categoria]/[...caminho] route — there is no root lesson route.
# generateStaticParams() there now hardcodes pt-BR only (no locale loop), so
# this single job builds the whole site.
#
# The pt-br job also emits backward-compat redirect stubs at the OLD root URLs
# (/aulas/… → /pt-br/aulas/…) via scripts/gen-redirect-stubs.mjs.
#
# To resume other locales: restore a matrix entry here, restore the "Translated
# locales" loop in generateStaticParams() (app/[locale]/.../page.tsx and
# opengraph-image.tsx), and the multi-locale logic in sitemap.ts / seo/urls.ts
# / seo/metadata.ts (see CLAUDE.md §4 for the full list of what was trimmed).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # URL codes. fsdir = content/i18n/<dir> for per-locale cache scoping
        # ('' for pt-BR, whose source lives in content/).
        include:
          - { url: pt-br, fsdir: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate content frontmatter
        run: npm run validate-content

      # Per-locale cache key: shared source + canonical PT-BR content + ONLY this
      # locale's i18n dir. An en-US edit busts the en job's cache, not pt-br's.
      - name: Restore .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.url }}-${{ hashFiles('package-lock.json', 'src/**/*.ts', 'src/**/*.tsx', 'app/**/*.ts', 'app/**/*.tsx', 'next.config.mjs', 'mdx-components.tsx', 'tsconfig.json', 'content/aulas/**/*.mdx', 'content/financas-quantitativas/**/*.mdx', 'content/metodos-numericos/**/*.mdx', 'content/calculo-1/**/*.mdx') }}-${{ hashFiles(format('content/i18n/{0}/**/*.mdx', matrix.fsdir)) }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.url }}-

      - name: Generate per-locale manifest
        env:
          BUILD_LOCALE: ${{ matrix.url }}
        run: npx tsx scripts/generate-manifest.ts

      # Fail fast on render-time MDX errors (e.g. "R is not defined" from
      # $\mathbb{R}$ inside a JSX fragment) BEFORE the 4-min next build. acorn
      # parsing alone can't catch these — this actually renders each lesson.
      # Scoped to what THIS job builds (pt-BR base + this locale's i18n dir) so
      # broken files in not-yet-built locales don't block the matrix.
      - name: Render-check content (build-accurate, this locale)
        run: node scripts/check-mdx-render.mjs --build-locale=${{ matrix.url }}

      - name: Build static site (locale ${{ matrix.url }})
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          BUILD_LOCALE: ${{ matrix.url }}
          # Effective heap comes from package.json's build script (cross-env).
          # 13 GB headroom on the 16 GB ubuntu-latest runner; per-locale build
          # is far lighter than the old all-in-one.
          NODE_OPTIONS: --max-old-space-size=13312
          NEXT_TELEMETRY_DISABLED: '1'
          # Mapa de Visitantes — PUBLIC anon values (RLS-protected). Add them as
          # repo secrets (Settings > Secrets and variables > Actions). If unset,
          # the pin map degrades to an empty state and the build stays green.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # Backward-compat: old root /aulas/… URLs → /pt-br/aulas/… (pt-br job only,
      # since it owns the root tree in ./out).
      - name: Emit root→/pt-br redirect stubs
        if: matrix.url == 'pt-br'
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/gen-redirect-stubs.mjs

      - name: Upload locale slice
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.url }}
          path: ./out
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all locale slices
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: slices

      - name: Merge slices into ./out
        run: |
          set -euo pipefail
          mkdir -p out
          for d in slices/*/; do
            echo "merging $d"
            cp -a "$d". out/
          done
          echo "=== merged tree (depth 2) ==="
          find out -maxdepth 2 -type d | sort | head -50
          echo "total html files: $(find out -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
