name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# PER-LOCALE MATRIX BUILD
#
# Why: bundling all 11 locales' lesson MDX into ONE webpack process OOMs — the
# module graph (120 lessons × N locales) does not fit any heap. Instead each
# locale builds in its OWN runner job via BUILD_LOCALE:
#   - generate-manifest.ts emits ONLY that locale's modules (matrix mode)
#   - generateStaticParams() emits ONLY that locale's pages (honors BUILD_LOCALE)
# Per-job memory stays flat no matter how many locales exist, so this scales to
# all 11 (and beyond) linearly in CI time. Artifacts merge into one ./out.
#
# The pt-BR job builds the canonical root routes (/aulas/…) + every non-locale
# page (finance, exams, manifesto, …). Each locale job builds only /<loc>/…
# Add a locale to the matrix once it is exercise-synced (see generate-manifest).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # url = BUILD_LOCALE (URL prefix, what generateStaticParams + manifest
        # gate on); fsdir = the content/i18n/<dir> long code for cache scoping.
        # pt-BR has no i18n dir (canonical source) — fsdir '' makes its i18n
        # hash empty, which is correct.
        include:
          - { url: pt-BR, fsdir: '' }
          - { url: en, fsdir: en-US }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate content frontmatter
        run: npm run validate-content

      # Cache key is scoped per-locale so editing one locale's lessons does not
      # cold-build the others. It hashes: shared source/config + the canonical
      # PT-BR content (every job builds the root tree) + ONLY this locale's i18n
      # dir. An en-US lesson edit busts the `en` job's key but not `pt-BR`'s.
      # restore-keys give a partial hit (webpack reuses unchanged modules) even
      # when the exact key misses.
      - name: Restore .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.url }}-${{ hashFiles('package-lock.json', 'src/**/*.ts', 'src/**/*.tsx', 'app/**/*.ts', 'app/**/*.tsx', 'next.config.mjs', 'mdx-components.tsx', 'tsconfig.json', 'content/aulas/**/*.mdx', 'content/financas-quantitativas/**/*.mdx', 'content/metodos-numericos/**/*.mdx', 'content/calculo-1/**/*.mdx') }}-${{ hashFiles(format('content/i18n/{0}/**/*.mdx', matrix.fsdir)) }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.url }}-

      - name: Generate per-locale manifest
        env:
          BUILD_LOCALE: ${{ matrix.url }}
        run: npx tsx scripts/generate-manifest.ts

      - name: Build static site (locale ${{ matrix.url }})
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          BUILD_LOCALE: ${{ matrix.url }}
          # Heap headroom on the 16 GB ubuntu-latest runner. Per-locale build is
          # far lighter than the old all-in-one, but keep the headroom.
          NODE_OPTIONS: --max-old-space-size=13312
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # Sanitize the matrix key for use as an artifact name (no slashes).
      - name: Compute artifact name
        id: art
        run: echo "name=site-${{ matrix.url }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Upload locale slice
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: ./out
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all locale slices
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: slices

      # Merge every slice into one ./out. The pt-BR slice carries the root +
      # shared pages; each locale slice carries its /<loc>/… subtree. Slices are
      # disjoint except for shared static assets (_next, images) which are
      # byte-identical, so a plain overlay copy is safe.
      - name: Merge slices into ./out
        run: |
          set -euo pipefail
          mkdir -p out
          for d in slices/*/; do
            echo "merging $d"
            cp -a "$d". out/
          done
          echo "=== merged tree summary ==="
          find out -maxdepth 2 -type d | sort | head -40
          echo "total html files: $(find out -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
